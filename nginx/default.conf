# Nginx Reverse Proxy Configuration for Matie Project

gzip on;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    client_max_body_size 100M;

    # API proxy configuration
    location /api/ {
        # --- OPTIONS (PREFLIGHT) İSTEKLERİNİ SUNUCU KATMANINDA YAKALAYIP ONAYLAMA ---
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204; # Tarayıcıya "Her şey yolunda" (HTTP OK) cevabı fırlatıyoruz
        }
        # --------------------------------------------------------------------------

        proxy_pass http://housemate-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Swagger/API Documentation
    location /v3/ {
        proxy_pass http://housemate-backend:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://housemate-backend:8080;
        proxy_set_header Host $host;
    }

    # Frontend root and React Router support
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}