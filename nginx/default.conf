# Nginx Reverse Proxy Configuration for Matie Project

gzip on;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    client_max_body_size 100M;

    # API proxy configuration
    location /api/ {
        proxy_pass http://housemate-backend:8080;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS Ayarları: Spring Boot (WebConfig) zaten hallettiği için 
        # burada EKSTRA add_header SATIRI OLMAMALI. 
        # Eğer hala "multiple values" alırsan, Nginx'in hiçbir şey eklemediğinden emin oluyoruz.

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Swagger/API Documentation
    location /v3/ {
        proxy_pass http://housemate-backend:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://housemate-backend:8080;
        proxy_set_header Host $host;
    }

    # Frontend root and React Router support
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}